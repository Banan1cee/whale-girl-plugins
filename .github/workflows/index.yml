name: index

# 目录（index*.json）不再由投稿人手改，统一从 plugins/ + packages/ 生成：
#   · PR：在临时副本里生成目录并跑 validate.py，作者只提交插件源码和 ZIP；
#   · main：自动把生成结果提交回仓库，避免目录和包长期漂移。
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'packages/**'
      - 'scripts/build-index.js'
      - 'index*.json'

permissions:
  contents: read

jobs:
  validate-generated:
    name: 生成目录并校验（PR）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 在临时副本里生成并校验
        run: |
          set -euo pipefail
          rm -rf /tmp/market
          cp -r . /tmp/market
          cd /tmp/market
          node scripts/build-index.js
          python validate.py

  sync-catalog:
    name: 同步目录（main）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成目录
        run: node scripts/build-index.js
      - name: 有漂移就提交
        run: |
          set -euo pipefail
          if git diff --quiet -- index*.json; then
            echo '目录已同步，无需提交'
            exit 0
          fi
          git config user.name 'market-bot'
          git config user.email 'market-bot@users.noreply.github.com'
          git add index*.json
          git commit -m 'market: 自动同步目录（由 plugins/ 与 packages/ 生成）'
          git push
