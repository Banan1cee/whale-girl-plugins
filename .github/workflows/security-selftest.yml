name: security-selftest

# 维护工具 CI，不是上架门禁：
#   · 它执行 PR 里的检查器测试，只用于开发回归；
#   · 它不产生可信投稿结论，也不签署任何东西；
#   · 它没有 secrets、没有写入权限；只读 token 仅用于 checkout。
# 可信投稿门禁见 security.yml（pull_request_target + 可信 base）。
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    name: 检测器回归（非门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检测器对抗回归
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s security -p 'test_*.py' -v
      - name: 隔离适配器自检（不启动容器、不加载插件）
        run: |
          set -euo pipefail
          node --check security/harness/run.cjs
          node security/harness/selftest.cjs
      - name: 工作流/门禁静态自检
        if: success()
        env:
          PYTHONUTF8: '1'
        run: python security/selftest_workflows.py
